<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>VeriPago · Ingresar</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f9d6b'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #f4f6f8; --card: #ffffff; --text: #1d2733; --muted: #64707d; --border: #dde2e8;
      --brand: #0f9d6b; --brand-hover: #0b8058; --danger-bg: #fdecec; --danger: #b42323;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11161c; --card: #1a2129; --text: #e8edf2; --muted: #9aa6b2; --border: #2c3640;
        --brand: #19b37e; --brand-hover: #20c98e; --danger-bg: #3a1c1c; --danger: #ff9b9b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 16px; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 32px 28px; box-shadow: 0 8px 30px rgba(0,0,0,.06);
    }
    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .logo-mark {
      width: 40px; height: 40px; border-radius: 10px; background: var(--brand); color: #fff;
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px;
    }
    h1 { font-size: 22px; margin: 0; }
    p.sub { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
    label { display: block; font-size: 14px; font-weight: 600; margin: 16px 0 6px; }
    input {
      width: 100%; padding: 12px 14px; font-size: 16px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
    }
    input:focus { outline: 2px solid var(--brand); outline-offset: 1px; border-color: transparent; }
    .pass-wrap { position: relative; }
    .pass-wrap input { padding-right: 76px; }
    .toggle {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      background: none; border: 0; color: var(--muted); font-size: 13px; cursor: pointer; padding: 6px;
    }
    button.primary {
      width: 100%; margin-top: 24px; padding: 13px; font-size: 16px; font-weight: 600; border: 0;
      border-radius: 10px; background: var(--brand); color: #fff; cursor: pointer;
    }
    button.primary:hover { background: var(--brand-hover); }
    button.primary:disabled { opacity: .7; cursor: wait; }
    .error {
      display: none; background: var(--danger-bg); color: var(--danger); border-radius: 10px;
      padding: 10px 12px; font-size: 14px; margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">
      <div class="logo-mark" aria-hidden="true">✓</div>
      <h1>VeriPago</h1>
    </div>
    <p class="sub">Ingresá para ver tus cobros.</p>

    <div id="error" class="error" role="alert"></div>

    <form method="post" action="/login" onsubmit="startLogin()">
      <label for="username">Usuario</label>
      <input id="username" name="username" autocomplete="username" required autofocus />

      <label for="password">Contraseña</label>
      <div class="pass-wrap">
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button type="button" class="toggle" onclick="togglePass(this)">Mostrar</button>
      </div>

      <button id="submit" class="primary" type="submit">Ingresar</button>
    </form>
  </main>

  <script>
    // Si el navegador restaura la página (botón "Atrás") o el envío no avanza, el botón vuelve a quedar usable.
    let loginTimer = null;
    function resetButton() {
      const btn = document.getElementById('submit');
      btn.disabled = false;
      btn.textContent = 'Ingresar';
      clearTimeout(loginTimer);
    }
    function startLogin() {
      const btn = document.getElementById('submit');
      btn.disabled = true;
      btn.textContent = 'Ingresando…';
      loginTimer = setTimeout(() => {
        resetButton();
        const box = document.getElementById('error');
        box.textContent = 'El servidor no respondió. Revisá que esté encendido y probá de nuevo.';
        box.style.display = 'block';
      }, 15000);
    }
    window.addEventListener('pageshow', resetButton);

    function togglePass(btn) {
      const input = document.getElementById('password');
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.textContent = show ? 'Ocultar' : 'Mostrar';
    }
    const err = new URLSearchParams(location.search).get('error');
    if (err) {
      const box = document.getElementById('error');
      box.textContent = err === 'locked'
        ? 'Demasiados intentos fallidos. Esperá 15 minutos y probá de nuevo.'
        : 'Usuario o contraseña incorrectos.';
      box.style.display = 'block';
    }
  </script>
</body>
</html>
